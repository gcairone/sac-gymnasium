# configs/08_swimmer_v5.yaml
env: Swimmer-v5
seed: 0
total_steps: 2_000_000

# SAC - The Horizon Fix
gamma: 0.9999           # CRITICO: Espande l'orizzonte a 10.000 step. L'agente ora ignora il costo a breve termine per la velocità a lungo termine.
tau: 0.005
lr_actor: 3.0e-4
lr_critic: 3.0e-4
lr_alpha: 3.0e-4        # RIPRISTINATO: L'autotuning ora funzionerà correttamente
alpha_init: 0.1
target_entropy: null    # RIPRISTINATO: Target automatico a -dim(A) = -2.0
batch_size: 256
replay_buffer_size: 1_000_000
gradient_clip_norm: 1.0

# Network
hidden_dim: 256
hidden_layers: 2
activation: relu

# Training schedule
warmup_steps: 100_000   
train_freq: 1
train_log_freq: 100
updates_per_step: 1

# Evaluation
eval_freq: 10_000
eval_episodes: 10

# Checkpointing
checkpoint_freq: 100_000