# configs/11_humanoid_standup_v5.yaml
env: HumanoidStandup-v5
seed: 0
total_steps: 3_000_000

# SAC - Il protocollo di contenimento numerico
gamma: 0.99              
tau: 0.002
lr_actor: 3.0e-4        
lr_critic: 3.0e-4       
lr_alpha: 3.0e-4          
alpha_init: 0.2         
target_entropy: -17.0   
reward_scale_enabled: false
reward_scale: 1.0
reward_clip: 0.0

batch_size: 256
replay_buffer_size: 1_000_000
gradient_clip_norm: 0.5 

hidden_dim: 256        
hidden_layers: 2
activation: relu       

# Training schedule
warmup_steps: 10_000
train_freq: 1
train_log_freq: 100
updates_per_step: 1

# Evaluation
eval_freq: 10_000
eval_episodes: 10

# Checkpointing
checkpoint_freq: 100_000
