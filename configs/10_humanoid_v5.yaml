# configs/10_humanoid_v5.yaml
env: Humanoid-v5
seed: 0
total_steps: 2_000_000

# SAC
gamma: 0.99
tau: 0.005
lr_actor: 3.0e-4
lr_critic: 3.0e-4
lr_alpha: 3.0e-4
alpha_init: 0.2
target_entropy: null  # null = auto: -dim(action_space)
reward_scale_enabled: false
reward_scale: 1.0
reward_clip: 0.0
rescale_actions: true  # Humanoid bounds are [-0.4, 0.4]: map the policy's [-1, 1] output onto them
batch_size: 256
replay_buffer_size: 1_000_000
gradient_clip_norm: 1.0  # 0 = disabled

# Network
hidden_dim: 256
hidden_layers: 2
activation: relu

# Training schedule
warmup_steps: 10_000
train_freq: 2  # one update every 2 env steps: updates dominate CPU time, env steps are ~40x cheaper
train_log_freq: 100
updates_per_step: 1

# Evaluation
eval_freq: 20_000
eval_episodes: 10

# Checkpointing
checkpoint_freq: 100_000
