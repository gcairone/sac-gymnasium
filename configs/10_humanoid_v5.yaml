# configs/10_humanoid_v5.yaml
env: Humanoid-v5
seed: 0
total_steps: 3_000_000

gamma: 0.99
tau: 0.005
lr_actor: 1.0e-4        
lr_critic: 3.0e-4       
lr_alpha: 3.0e-4          
alpha_init: 0.05        
target_entropy: -17.0   

batch_size: 1024
replay_buffer_size: 1_000_000
gradient_clip_norm: 1.0 

hidden_dim: 512         
hidden_layers: 2
activation: relu        

# Training schedule
warmup_steps: 10_000
train_freq: 1
train_log_freq: 100
updates_per_step: 1

# Evaluation
eval_freq: 10_000
eval_episodes: 10
# Checkpointing
checkpoint_freq: 100_000